services:
  # ----------------------------------------------------------------------------
  # 1. Relational Persistence Store: PostgreSQL 16
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: sentrapay-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      PGTZ: ${TZ:-Asia/Kolkata}
      POSTGRES_DB: ${POSTGRES_DB:-sentrapay_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/schema-postgres.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sentrapay_db}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 2. Distributed In-Memory Cache & Velocity Store: Redis 7.2
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: sentrapay-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    environment:
      TZ: ${TZ:-Asia/Kolkata}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 3. Distributed Event Backbone: Apache Kafka (KRaft Mode)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: sentrapay-kafka
    restart: unless-stopped
    user: "0:0"
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports:
      - "${KAFKA_PORT:-29092}:29092"
    volumes:
      - kafka_data:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 4. Machine Learning Inference Sidecar: Python gRPC Service
  # ----------------------------------------------------------------------------
  ml-inference-service:
    build:
      context: ..
      dockerfile: services/ml-inference-service/Dockerfile
    container_name: sentrapay-ml-inference
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      GRPC_PORT: ${ML_GRPC_PORT:-50051}
      HTTP_PORT: ${ML_HTTP_PORT:-8000}
    ports:
      - "${ML_GRPC_PORT:-50051}:50051"
      - "${ML_HTTP_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 5. Core Wallet & Payment Switch Service: Spring Boot 3.3
  # ----------------------------------------------------------------------------
  wallet-service:
    build:
      context: ..
      dockerfile: services/wallet-service/Dockerfile
    container_name: sentrapay-wallet-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentrapay_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-SentraPayEnterprisePaymentSwitchSecretKeyWith256BitsOfEntropySecureHMACSHA256}
      SERVER_PORT: 8081
    ports:
      - "${WALLET_SERVICE_PORT:-8081}:8081"
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 6. Hybrid Fraud & Risk Evaluation Service: Spring Boot 3.3
  # ----------------------------------------------------------------------------
  fraud-detection-service:
    build:
      context: ..
      dockerfile: services/fraud-detection-service/Dockerfile
    container_name: sentrapay-fraud-service
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      ml-inference-service:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ML_HTTP_URL: http://ml-inference-service:8000
      ML_GRPC_HOST: ml-inference-service
      ML_GRPC_PORT: 50051
      SERVER_PORT: 8082
    ports:
      - "${FRAUD_SERVICE_PORT:-8082}:8082"
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 7. Double-Entry Ledger & Bank Reconciliation Service: Spring Batch 5
  # ----------------------------------------------------------------------------
  reconciliation-service:
    build:
      context: ..
      dockerfile: services/reconciliation-service/Dockerfile
    container_name: sentrapay-recon-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-sentrapay_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8083
    ports:
      - "${RECON_SERVICE_PORT:-8083}:8083"
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 8. Real-Time Server-Sent Events Notification Service: Spring WebFlux
  # ----------------------------------------------------------------------------
  notification-service:
    build:
      context: ..
      dockerfile: services/notification-service/Dockerfile
    container_name: sentrapay-notification-service
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      TZ: ${TZ:-Asia/Kolkata}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SERVER_PORT: 8084
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8084}:8084"
    networks:
      - sentrapay-network

  # ----------------------------------------------------------------------------
  # 9. Edge API Gateway & Reverse Proxy: Nginx
  # ----------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: sentrapay-gateway
    restart: unless-stopped
    depends_on:
      - wallet-service
      - fraud-detection-service
      - reconciliation-service
      - notification-service
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist:/usr/share/nginx/html:ro
    networks:
      - sentrapay-network

networks:
  sentrapay-network:
    name: sentrapay-network
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:

